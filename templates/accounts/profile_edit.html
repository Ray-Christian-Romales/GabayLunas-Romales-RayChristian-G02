{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<form method="post" novalidate class="card">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save changes</button>
  <a href="{% url 'profile' %}">Cancel</a>
</form>
{% endblock %}
